- project: Primislayer
  # role: Founder & Primary Developer
  # duration: 2012 &mdash; Present
  url: "https://primislayer.carrd.co"
  description: Sistema de segurança apresentado ao Programa Talento Tech 2024 – Projeto Integrador. Utiliza NGINX, NAXSI e Fail2ban para proteger uma aplicação web contra ameaças. O projeto inclui um painel de administração em Flask para monitoramento, autenticação com mTLS, alertas via Telegram e foi totalmente containerizado com Docker.


