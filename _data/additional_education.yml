# Degree
- degree: Programa Mentores da OBMEP
  uni: Instituto de Matemática Pura e Aplicada
  year: 2024
  # awards:
  #   - award: Summa Cumme Laude graduate
  summary: O Programa Mentores da OBMEP é uma extensão do Programa de Iniciação Científica Júnior (PIC) que oferece a estudantes premiados na OBMEP, já experientes no PIC, a oportunidade de aprofundar conhecimentos em áreas avançadas da matemática com professores universitários. O programa disponibiliza cursos, atividades interativas como videoconferências e fóruns, e prepara os alunos para o ambiente universitário e carreiras científicas. 

- degree: Programa de Iniciação Científica Jr. da OBMEP
  uni: Instituto de Matemática Pura e Aplicada
  year: 2022 &mdash; 2024
  # awards:
  #   - award: Summa Cumme Laude graduate
  summary: O Programa de Iniciação Científica Jr. (PIC) é um programa que propicia ao aluno premiado da OBMEP, entrar em contato com interessantes questões no ramo da Matemática, ampliando o seu conhecimento científico e preparando-o para um futuro desempenho profissional e acadêmico. No PIC, o aluno participa de atividades orientadas por professores qualificados em instituições de ensino superior e de pesquisa.